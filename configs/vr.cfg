; Quest (OpenXR). See pc.cfg for how these files are used.
; The main scene is the level itself: there is no start screen in the headset.

[application]
run/main_scene="res://scenes/levels/hotel_siberia/hotel_level_4.tscn"

[debug]
file_logging/enable_file_logging=false

[display]
window/vsync/vsync_mode=0

[xr]
openxr/enabled=true

[rendering]
renderer/rendering_method.mobile="mobile"
vrs/mode=0
scaling_3d/scale=1.0
