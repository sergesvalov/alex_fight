; Platform differences, applied to project.godot by tools/apply_config.sh.
; Every platform file lists the same keys, so applying one fully undoes another.
; project.godot itself is kept at these (PC) values.

[application]
run/main_scene="res://scenes/ui/start_screen.tscn"

[debug]
file_logging/enable_file_logging=true

[display]
window/vsync/vsync_mode=1

[xr]
openxr/enabled=false

[rendering]
renderer/rendering_method.mobile="gl_compatibility"
vrs/mode=1
scaling_3d/scale=0.75
